name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compilar y pasar tests
    # El proyecto necesita Xcode 26 o posterior (Swift 6.2, SDK de iOS 26 para Liquid Glass).
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar la versión estable más reciente de Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Elegir un simulador de iPhone
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, entries in devices.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match[1]), int(match[2]))
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      if best is None or version > best[0]:
                          best = (version, device["udid"], device["name"])
          if best is None:
              sys.exit("No hay simuladores de iPhone disponibles")
          print(f"{best[2]} (iOS {best[0][0]}.{best[0][1]})", file=sys.stderr)
          print(best[1])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Compilar y ejecutar los tests
        run: |
          xcodebuild test \
            -quiet \
            -project ClosetFinder.xcodeproj \
            -scheme ClosetFinder \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Guardar el resultado de los tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
